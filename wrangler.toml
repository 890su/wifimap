# Cloudflare Pages. Deploy the static build with:
#   npx wrangler pages deploy dist --project-name wifiplan
name = "wifiplan"
compatibility_date = "2024-11-22"
pages_build_output_dir = "dist"

[vars]
SHORT_LINKS_ENABLED = "false"

# Optional KV for short links. Create a namespace, then uncomment:
#   npx wrangler kv namespace create LINKS
# [[kv_namespaces]]
# binding = "LINKS"
# id = "REPLACE_WITH_NAMESPACE_ID"
